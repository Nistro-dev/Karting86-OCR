<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Timer Test - Apex Timing OCR</title>
<style>
  :root {
    --bg: #b8b8b8;
    --fg: #111111;
  }
  body.dark {
    --bg: #000000;
    --fg: #00ff2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #222;
    font-family: Segoe UI, Arial, sans-serif;
    color: #eee;
  }
  /* La boîte garde TOUJOURS la même taille (celle de "00:00:00" à la taille de
     référence), quel que soit le contenu : la zone OCR calibrée reste valable.
     C'est le texte qui est réduit pour tenir dedans, jamais la boîte qui grandit. */
  #display {
    background: var(--bg);
    color: var(--fg);
    font-weight: bold;
    font-size: 15vw;
    line-height: 1;
    padding: 0.2em 0.5em;
    border-radius: 8px;
    user-select: none;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    overflow: hidden;
  }
  #displayText {
    font-size: inherit;
    line-height: 1;
  }
  #panel {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }
  button, input, select {
    font-size: 15px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #333;
    color: #eee;
  }
  button {
    cursor: pointer;
  }
  button:hover { background: #444; }
  label { font-size: 14px; }
</style>
</head>
<body>

  <div id="display"><span id="displayText">02:00</span></div>

  <div id="panel">
    <label>Durée <input id="startInput" type="text" value="02:00" size="6"></label>

    <button id="btnStart">▶ Démarrer</button>
    <button id="btnPause">⏸ Pause</button>
    <button id="btnReset">⟲ Réinitialiser</button>

    <select id="modeSelect">
      <option value="down">Compte à rebours</option>
      <option value="up">Chronomètre (compte +)</option>
    </select>
    <select id="fmtSelect">
      <option value="mmss">MM:SS</option>
      <option value="hhmmss">HH:MM:SS</option>
    </select>
    <button id="btnTheme">Basculer thème (gris/noir)</button>

    <label><input type="checkbox" id="lapsToggle"> Afficher les tours</label>
    <label>Total tours <input id="lapsTotalInput" type="number" value="20" min="1" size="4"></label>
    <button id="btnLapDone">+1 tour</button>
  </div>

<script>
  const display = document.getElementById('display');
  const displayText = document.getElementById('displayText');
  const startInput = document.getElementById('startInput');
  const modeSelect = document.getElementById('modeSelect');
  const fmtSelect = document.getElementById('fmtSelect');
  const lapsToggle = document.getElementById('lapsToggle');
  const lapsTotalInput = document.getElementById('lapsTotalInput');
  const btnLapDone = document.getElementById('btnLapDone');

  const STORAGE_KEY = 'apexOcrTestTimer';
  const BOX_REFERENCE_TEXT = '00:00:00';   // contenu qui définit la taille (fixe) de la boîte

  function loadSettings() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function saveSettings(patch) {
    try {
      const cur = loadSettings();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...cur, ...patch }));
    } catch (e) { /* ignore */ }
  }

  const settings = loadSettings();
  // Paramètres d'URL (tests) : ?duration=10:00&fmt=hhmmss&laps=1&lapsTotal=20&theme=dark
  const params = new URLSearchParams(location.search);
  if (params.has('duration')) settings.duration = params.get('duration');
  if (params.has('fmt')) settings.fmt = params.get('fmt');
  if (params.has('laps')) settings.showLaps = params.get('laps') === '1';
  if (params.has('lapsTotal')) settings.lapsTotal = params.get('lapsTotal');
  if (params.has('theme')) settings.theme = params.get('theme');
  startInput.value = settings.duration || '02:00';
  modeSelect.value = settings.countMode || 'down';
  fmtSelect.value = settings.fmt || 'mmss';
  lapsToggle.checked = settings.showLaps || false;
  lapsTotalInput.value = settings.lapsTotal || 20;
  if (settings.theme === 'dark') document.body.classList.add('dark');

  let lapsDone = 0;

  // --- Boîte à taille fixe, texte réduit pour tenir dedans ---
  function lockBoxSize() {
    display.style.width = '';
    display.style.height = '';
    displayText.style.fontSize = '';
    const current = displayText.textContent;
    displayText.textContent = BOX_REFERENCE_TEXT;
    const box = display.getBoundingClientRect();
    display.style.width = `${box.width}px`;
    display.style.height = `${box.height}px`;
    displayText.textContent = current;
    fitText();
  }

  function fitText() {
    displayText.style.fontSize = '';
    const cs = getComputedStyle(display);
    const avail = display.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const width = displayText.getBoundingClientRect().width;
    if (width > avail && width > 0) {
      displayText.style.fontSize = `${parseFloat(cs.fontSize) * avail / width}px`;
    }
  }

  window.addEventListener('resize', lockBoxSize);

  function parseToSeconds(str) {
    const parts = str.split(':').map(n => parseInt(n, 10) || 0);
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    return 0;
  }

  function formatSeconds(totalSeconds) {
    totalSeconds = Math.max(0, totalSeconds);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = Math.floor(totalSeconds % 60);
    const pad = n => String(n).padStart(2, '0');
    if (fmtSelect.value === 'hhmmss') {
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    return `${pad(m)}:${pad(s)}`;
  }

  let baseSeconds = parseToSeconds(startInput.value);
  let elapsed = 0;
  let running = false;
  let lastTick = null;
  let rafId = null;

  function currentSeconds() {
    if (modeSelect.value === 'down') {
      return baseSeconds - elapsed;
    }
    return elapsed;
  }

  function render() {
    const time = formatSeconds(currentSeconds());
    // Tours à gauche du temps, sur la même ligne (jamais au-dessus).
    const text = lapsToggle.checked ? `${lapsDone}/${lapsTotalInput.value} ${time}` : time;
    if (displayText.textContent !== text) {
      displayText.textContent = text;
      fitText();
    }
  }

  function tick(ts) {
    if (!running) return;
    if (lastTick !== null) {
      elapsed += (ts - lastTick) / 1000;
    }
    lastTick = ts;
    render();
    if (modeSelect.value === 'down' && currentSeconds() <= 0) {
      elapsed = baseSeconds;
      render();
      running = false;
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function startTimer() {
    if (running) return;
    running = true;
    lastTick = null;
    rafId = requestAnimationFrame(tick);
  }

  function pauseTimer() {
    running = false;
    lastTick = null;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function resetTimer() {
    pauseTimer();
    baseSeconds = parseToSeconds(startInput.value);
    elapsed = 0;
    lapsDone = 0;
    render();
  }

  // --- Contrôles (aucun démarrage automatique : on lance à la main) ---
  document.getElementById('btnStart').addEventListener('click', startTimer);
  document.getElementById('btnPause').addEventListener('click', pauseTimer);
  document.getElementById('btnReset').addEventListener('click', resetTimer);

  document.getElementById('btnTheme').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    saveSettings({ theme: document.body.classList.contains('dark') ? 'dark' : 'light' });
  });

  startInput.addEventListener('change', () => {
    saveSettings({ duration: startInput.value });
    resetTimer();
  });

  modeSelect.addEventListener('change', () => {
    saveSettings({ countMode: modeSelect.value });
    resetTimer();
  });

  fmtSelect.addEventListener('change', () => {
    saveSettings({ fmt: fmtSelect.value });
    render();
  });

  lapsToggle.addEventListener('change', () => {
    saveSettings({ showLaps: lapsToggle.checked });
    render();
  });

  lapsTotalInput.addEventListener('change', () => {
    saveSettings({ lapsTotal: lapsTotalInput.value });
    render();
  });

  btnLapDone.addEventListener('click', () => {
    lapsDone = Math.min(Number(lapsTotalInput.value) || 0, lapsDone + 1);
    render();
  });

  // --- Init ---
  lockBoxSize();
  resetTimer();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(lockBoxSize);
  }
  if (params.get('run') === '1') startTimer();   // démarrage auto pour les tests uniquement (?run=1)
</script>
</body>
</html>
